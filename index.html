<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio CertifOrti – Agronomia Urbana</title>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f4;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #1b5e20;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .logo-container {
            display: flex;
            align-items: center;
            position: relative;
        }

        .logo-container img {
            height: 120px;
            width: 120px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            background-color: #fdfbf7;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin-right: 18px;
        }

        .text-header-container {
            display: flex;
            flex-direction: column;
        }

        .org-name {
            color: #ffffff;
            font-size: 1.5em;
            font-weight: bold;
        }

        .org-domain {
            color: #c8e6c9;
            font-size: 0.9em;
            margin-top: 3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-link-header,
        .btn-quote-header {
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
        }

        .btn-link-header {
            background-color: #25d366;
            color: white;
        }

        .btn-quote-header {
            background-color: #ffffff;
            color: #1b5e20;
            border: 1px solid #ffffff;
        }

        .hero {
            background-color: #e8f5e9;
            padding: 50px 20px 40px 20px;
            border-bottom: 3px solid #c8e6c9;
            text-align: center;
        }

        .hero h1 {
            color: #1b5e20;
            font-size: 2.2em;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.1em;
            color: #444;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="logo.png" alt="Logo Studio CertifOrti">
        <div class="text-header-container">
            <span class="org-name">Studio CertifOrti</span>
            <span class="org-domain">Agronomia Urbana & Certificazioni</span>
        </div>
    </div>

    <div class="header-actions">
        <a href="https://wa.me" class="btn-link-header" target="_blank">WhatsApp</a>
        <a href="#preventivo" class="btn-quote-header">Richiedi Preventivo</a>
    </div>
</header>

<section class="hero">
    <h1>Consulenza Agronomica e Certificazioni per l'Agricoltura Urbana</h1>
    <p>Soluzioni professionali per orti urbani, terrazze, serre e coltivazioni sostenibili.</p>
</section>

</body>
</html>
