<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertifOrti – Agronomia Urbana, Suolo, ISO, HACCP</title>
    <meta name="description" content="Studio CertifOrti – Agronomia urbana, rigenerazione del suolo, consulenze ISO, HACCP, progetti ambientali e sostenibilità.">
    <meta name="keywords" content="agronomia urbana, suolo, ISO 9001, ISO 14001, ISO 22000, HACCP, sostenibilità, orti urbani, CertifOrti, consulenze ambientali">
    <meta name="author" content="CertifOrti">

    <!-- COERENZA TIPOGRAFICA ED ELEGANZA VISIVA -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cloudflare.com" rel="stylesheet">

    <style>
        :root {
            --leaf-green: #1e5e1a;          
            --leaf-green-light: #4CAF50;    
            --leaf-green-dark: #113813;     
            --oro-satinato: #c59b27;         
            --panna-chiaro: #fdfbf7;         
            --stone-gray: #2b3a2a;          
            --stone-gray-light: #fafbfa;    
        }

        body {
            background: var(--panna-chiaro);
            color: var(--stone-gray);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        header {
            background: var(--leaf-green);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 10000;
            height: 70px;
            box-sizing: border-box;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .brand-text {
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        nav a {
            margin-left: 24px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95em;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--oro-satinato);
        }

        #drawer-btn {
            position: fixed;
            top: 15px;
            right: 20px;
            background: var(--leaf-green-light);
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: none;
        }

        #drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: var(--leaf-green-dark);
            color: white;
            padding: 40px 30px;
            box-sizing: border-box;
            transition: left 0.4s ease;
            z-index: 10000;
            box-shadow: 5px 0 25px rgba(0,0,0,0.3);
        }

        #drawer.open {
            left: 0;
        }

        #drawer h2 {
            font-family: 'Playfair Display', serif;
            color: var(--oro-satinato);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-top: 0;
        }

        #drawer a {
            display: block;
            margin: 20px 0;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s;
        }

        #drawer a:hover {
            color: var(--oro-satinato);
        }

        section {
            padding: 90px 40px;
            max-width: 1200px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .hero {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            max-width: 100%;
            padding: 100px 40px 80px 40px;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2em;
            color: var(--leaf-green);
            margin: 0;
        }

        .hero p {
            font-size: 1.25em;
            margin-top: 20px;
            color: #3b4d3a;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4em;
            color: var(--leaf-green);
            margin-bottom: 20px;
            text-align: center;
        }

        .section-desc {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 40px auto;
            font-size: 1.1em;
            color: #555;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .service-box {
            background: var(--stone-gray-light);
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            border-top: 4px solid var(--oro-satinato);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .service-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(27, 94, 32, 0.08);
        }

        .service-box i {
            font-size: 44px;
            color: var(--leaf-green-light);
            margin-bottom: 20px;
        }

        .service-box h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4em;
            margin: 0 0 15px 0;
            color: var(--leaf-green);
        }

        .quote-form-container {
            background: #ffffff;
            max-width: 700px;
            margin: 50px auto 0 auto;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            text-align: left;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
            color: var(--leaf-green);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #dcdfdc;
            background: #fafbfa;
            font-family: inherit;
            font-size: 1em;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--leaf-green-light);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25d366;
            color: white;
            padding: 16px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1em;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.25);
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        footer {
            background: var(--leaf-green-dark);
            color: white;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.95em;
            border-top: 4px solid var(--oro-satinato);
        }

        .gallery-placeholder {
            background: #f0f3f0;
            border: 2px dashed #cbd5cb;
            padding: 60px;
            border-radius: 12px;
            color: #778876;
            font-weight: 500;
        }

        @media (max-width: 992px) {
            header {
                height: auto;
                padding: 20px;
                justify-content: center;
            }
            .logo-wrapper {
                text-align: center;
            }
            .brand-text {
                font-size: 2em;
            }
            nav {
                display: none;
            }
            #drawer-btn {
                display: block;
            }
            .hero h1 {
                font-size: 2.4em;
            }
            .quote-form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<button id="drawer-btn" onclick="toggleDrawer()">
    <i class="fas fa-bars"></i>
</button>

<div id="drawer">
    <h2>CertifOrti</h2>
    <a href="#home" onclick="toggleDrawer()">Home</a>
    <a href="#chi-siamo" onclick="toggleDrawer()">Chi Siamo</a>
    <a href="#servizi" onclick="toggleDrawer()">Servizi</a>
    <a href="#progetti" onclick="toggleDrawer()">Progetti</a>
    <a href="#iso" onclick="toggleDrawer()">Certificazioni ISO</a>
    <a href="#team" onclick="toggleDrawer()">Team</a>
    <a href="#preventivi" onclick="toggleDrawer()">Preventivi</a>
</div>

<header id="home">
    <div class="logo-wrapper">
        <div class="brand-text">CertifOrti</div>
    </div>
    <nav>
        <a href="#chi-siamo">Chi Siamo</a>
        <a href="#servizi">Servizi</a>
