<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio CertifOrti – Agronomia Urbana</title>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f4;
            color: #333;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        header {
            background-color: #1b5e20;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 10000;
            height: 60px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            flex: 1;
            white-space: nowrap;
            position: relative;
            height: 100%;
        }

        .logo-container img {
            height: 150px;
            width: 150px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;

            position: absolute;
            top: -45px;
            left: 10px;
            z-index: 99999;

            background-color: #fdfbf7;
            border: 5px solid #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);

            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        box-shadow 0.4s ease;
        }

        .logo-container img:hover {
            transform: scale(1.06) rotate(3deg);
            box-shadow: 0 14px 32px rgba(27, 94, 32, 0.35);
        }

        .text-header-container {
            display: flex;
            flex-direction: column;
            margin-left: 180px;
            max-width: 60%;
        }

        .org-name {
            color: #ffffff;
            font-size: 1.6em;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .org-domain {
            color: #c8e6c9;
            font-size: 0.85em;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .btn-link-header,
        .btn-quote-header {
            padding: 12px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .btn-link-header {
            background-color: #25d366;
            color: white;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
        }

        .btn-quote-header {
            background-color: #ffffff;
            color: #1b5e20;
            border: 1px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-link-header:hover,
        .btn-quote-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        .hero {
            background-color: #e8f5e9;
            padding: 60px 20px 40px 20px;
            border-bottom: 3px solid #c8e6c9;
        }

        .hero-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
        }

        .hero-text {
            text-align: center;
            flex: 1;
        }

        .hero h1 {
            color: #1b5e20;
            font-size: 2.4em;
            margin-bottom: 15px;
            margin-top: 0;
        }

        .hero p {
            font-size: 1.1em;
            color: #444;
            max-width: 800px;
            margin: 0 auto;
        }

        footer {
            background-color: #113813;
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            font-size: 0.95em;
            border-top: 4px solid #81c784;
            margin-top: 60px;
        }

        @media (max-width: 992px) {
            header {
                flex-direction: column;
                text-align: center;
                height: auto;
                gap: 20px;
                padding-bottom: 30px;
            }
            .logo-container img {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 15px;
                height: 130px;
                width: 130px;
            }
            .text-header-container {
                margin-left: 0;
                max-width: 100%;
            }
            .header-actions {
                margin-left: auto;
                margin-right: auto;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo-container">
        <img src="1.png" alt="Logo Studio CertifOrti">
        <div class="text-header-container">
            <span class="org-name">Studio CertifOrti</span>
            <span class="org-domain">Agronomia Urbana & Certificazioni</span>
        </div>
    </div>

    <div class="header-actions">
        <a href="https://wa.me" class="btn-link-header" target="_blank">WhatsApp</a>
        <a href="#preventivo" class="btn-quote-header">Richiedi Preventivo</a>
    </div>
</header>

<section class="hero">
    <div class="hero-container">
        <div class="hero-text">
            <h1>Consulenza Agronomica e Certificazioni per l'Agricoltura Urbana</h1>
            <p>Soluzioni professionali per orti urbani, terrazze, serre e coltivazioni sostenibili.</p>
        </div>
    </div>
</section>

</body>
</html>
