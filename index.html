<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>CertifOrti – Agronomia Urbana, Suolo, ISO, HACCP</title>
    <meta name="description" content="Studio CertifOrti – Agronomia urbana, rigenerazione del suolo, consulenze ISO, HACCP, progetti ambientali e sostenibilità.">
    <meta name="keywords" content="agronomia urbana, suolo, ISO 9001, ISO 22000, HACCP, sostenibilità, orti urbani, CertifOrti, consulenze ambientali">
    <meta name="author" content="CertifOrti">

    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Tema naturale verde foglia + automatic dark mode -->
    <style>

        :root {
            --leaf-green: #4CAF50;
            --leaf-green-dark: #2e7d32;
            --stone-gray: #3a3a3a;
            --stone-gray-light: #e8e8e8;
            --white: #ffffff;
            --black: #000000;
        }

        /* Tema chiaro */
        body {
            background: var(--white);
            color: var(--stone-gray);
            font-family: 'Poppins', sans-serif;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* Tema scuro automatico */
        @media (prefers-color-scheme: dark) {
            body {
                background: var(--stone-gray);
                color: var(--white);
            }
            header, nav {
                background: var(--leaf-green-dark);
            }
        }

        /* Animazioni leggere */
        .fade-in {
            opacity: 0;
            animation: fadeIn 1.2s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Logo glow */
        #logo {
            width: 140px;
            filter: drop-shadow(0 0 8px var(--leaf-green));
            animation: glowPulse 3s infinite ease-in-out;
        }
        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 4px var(--leaf-green)); }
            50% { filter: drop-shadow(0 0 12px var(--leaf-green)); }
            100% { filter: drop-shadow(0 0 4px var(--leaf-green)); }
        }

        /* Drawer mobile da destra */
        #drawer {
            position: fixed;
            top: 0;
            right: -260px;
            width: 260px;
            height: 100%;
            background: var(--leaf-green-dark);
            color: var(--white);
            padding: 30px;
            transition: right 0.4s ease;
            z-index: 9999;
        }
        #drawer.open {
            right: 0;
        }
        #drawer a {
            display: block;
            margin: 18px 0;
            color: var(--white);
            font-size: 18px;
            text-decoration: none;
        }

        /* Pulsante drawer */
        #drawer-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--leaf-green);
            color: var(--white);
            border: none;
            padding: 12px 14px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: var(--leaf-green);
            color: var(--white);
        }

        nav a {
            margin-left: 20px;
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
        }

        /* Bandiere */
        .flags {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .flags a {
            font-size: 20px;
            text-decoration: none;
        }

    </style>

</head>
<body>
