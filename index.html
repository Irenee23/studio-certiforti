<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio CertifOrti – Agronomia Urbana</title>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f4;
            color: #333;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        header {
            background-color: #1b5e20;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 10000;
            height: 60px; /* Altezza fissa per gestire l'effetto fluttuante */
        }

        /* ==========================================
           POSIZIONAMENTO ARTISTICO E PREMIUM DEL LOGO
           ========================================== */
        .logo-container {
            display: flex;
            align-items: center;
            flex: 1;
            white-space: nowrap;
            position: relative;
            height: 100%;
        }

        .logo-container img {
            height: 150px; /* Dimensione imponente e visibile */
            width: 150px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            
            /* EFFETTO FLUTTUANTE: Il logo esce dall'header e sbottona sulla pagina */
            position: absolute;
            top: -45px; /* Spinto verso l'alto per centrarlo a cavallo del bordo */
            left: 10px;
            z-index: 99999; /* Sempre sopra ogni elemento */
            
            /* CURA DEI DETTAGLI ARTISTICI */
            background-color: #fdfbf7; /* Sfondo panna coordinato */
            border: 5px solid #ffffff; /* Cornice bianca spessa stile sigillo */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); /* Ombra morbida per effetto 3D */
            
            /* ANIMAZIONE ORGANICA AL PASSAGGIO MOUSE */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        .logo-container img:hover {
            transform: scale(1.06) rotate(3deg); /* Si solleva e ruota leggermente con classe */
            box-shadow: 0 14px 32px rgba(27, 94, 32, 0.35); /* L'ombra si espande con alone verde bosco */
        }

        /* SPAZIO SACRO PER IL TESTO ACCANTO AL LOGO FLUTTUANTE */
        .text-header-container {
            display: flex;
            flex-direction: column;
            margin-left: 180px; /* Evita sovrapposizioni visive */
            max-width: 60%;
        }

        .org-name {
            color: #ffffff;
            font-size: 1.6em;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .org-domain {
            color: #c8e6c9;
            font-size: 0.85em;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .btn-link-header,
        .btn-quote-header {
            padding: 12px 22px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .btn-link-header {
            background-color: #25d366;
            color: white;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
        }

        .btn-quote-header {
            background-color: #ffffff;
            color: #1b5e20;
            border: 1px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-link-header:hover,
        .btn-quote-header:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        /* HERO SECTON — CORRETTO IL PADDING PER IL LOGO */
        .hero {
            background-color: #e8f5e9;
            padding: 60px 20px 40px 20px; /* Più spazio in alto per dare respiro al logo fluttuante */
            border-bottom: 3px solid #c8e6c9;
        }

        .hero-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
        }

        .hero-text {
            text-align: center;
            flex: 1;
        }

        .hero h1 {
            color: #1b5e20;
            font-size: 2.4em;
            margin-bottom: 15px;
            margin-top: 0;
        }

        .hero p {
            font-size: 1.1em;
            color: #444;
            max-width: 800px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            color: #1b5e20;
            font-size: 2em;
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            overflow: hidden;
            border-top: 5px solid #2e7d32;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-content {
            padding: 25px;
        }

        .card h3 {
            color: #2e7d32;
            margin-top: 0;
            font-size: 1.3em;
            margin-bottom: 12px;
        }

        .card p {
            font-size: 0.95em;
            color: #555;
            margin-bottom: 0;
        }

        #preventivo {
            margin-top: 80px;
            padding: 20px;
        }

        .quote-container {
            background: #f9fbf9;
            border: 2px solid #1b5e20;
            padding: 50px;
            border-radius: 18px;
            max-width: 750px;
            margin: 0 auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            font-size: 1.1em;
            margin-bottom: 8px;
            display: block;
            color: #1b5e20;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            font-size: 1.1em;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #bbb;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
        }

        .form-group textarea {
            min-height: 160px;
            resize: vertical;
        }

        .btn-submit {
            font-size: 1.3em;
            padding: 16px;
            border-radius: 10px;
            background-color: #1b5e20;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #145016;
        }

        /* FOOTER — ELEGANTE E PULITO SENZA DUPLICAZIONI */
        footer {
            background-color: #113813;
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            font-size: 0.95em;
            border-top: 4px solid #81c784;
            margin-top: 60px;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 992px) {
            header {
                flex-direction: column;
                text-align: center;
                height: auto;
                gap: 20px;
                padding-bottom: 30px;
            }
            .logo-container {
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: auto;
            }
            .logo-container img {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 15px;
                height: 130px;
                width: 130px;
            }
            .text-header-container {
                margin-left: 0;
                max-width: 100%;
            }
            .header-actions {
                margin-left: auto;
                margin-right: auto;
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .features {
                grid-template-columns: 1fr;
            }
            .quote-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <!-- Il puntamento al tuo file logo è ottimizzato e centrato -->
        <img src="PERCORSO_DEL_TUO_LOGO.png" alt="Logo Studio CertifOrti">
        <div class="text-header-container">
            <span class="org-name">Studio CertifOrti</span>
            <span class="org-domain">Agronomia Urbana & Certificazioni</span>
        </div>
    </div>

    <div class="header-actions">
        <a href="https://wa.me" class="btn-link-header" target="_blank">WhatsApp</a>
        <a href="#preventivo" class="btn-quote-header">Richiedi Preventivo</a>
    </div>
</header>

<!-- SEZIONE HERO -->
<section class="hero">
    <div class="hero-container">
        <div class="hero-text">
            <h1>Consulenza Agronomica e Certificazioni per l'Agricoltura Urbana</h1>
