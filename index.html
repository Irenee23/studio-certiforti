<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CertifOrti – Agronomia Urbana, Suolo, ISO, HACCP</title>
    <meta name="description" content="Studio CertifOrti – Agronomia urbana, rigenerazione del suolo, consulenze ISO, HACCP, progetti ambientali e sostenibilità.">
    <meta name="keywords" content="agronomia urbana, suolo, ISO 9001, ISO 14001, ISO 22000, HACCP, sostenibilità, orti urbani, CertifOrti, consulenze ambientali">
    <meta name="author" content="CertifOrti">

    <!-- FONT -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --leaf-green: #1e5e1a;
            --leaf-green-light: #4CAF50;
            --leaf-green-dark: #113813;
            --oro-satinato: #c59b27;
            --panna-chiaro: #fdfbf7;
            --stone-gray: #2b3a2a;
            --stone-gray-light: #fafbfa;
        }

        body {
            background: var(--panna-chiaro);
            color: var(--stone-gray);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        header {
            background: var(--leaf-green);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 10000;
            height: 70px;
            box-sizing: border-box;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .brand-text {
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        nav a {
            margin-left: 24px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95em;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--oro-satinato);
        }

        #drawer-btn {
            position: fixed;
            top: 15px;
            right: 20px;
            background: var(--leaf-green-light);
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: none;
        }

        #drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: var(--leaf-green-dark);
            color: white;
            padding: 40px 30px;
            box-sizing: border-box;
            transition: left 0.4s ease;
            z-index: 10000;
            box-shadow: 5px 0 25px rgba(0,0,0,0.3);
        }

        #drawer.open {
            left: 0;
        }

        #drawer h2 {
            font-family: 'Playfair Display', serif;
            color: var(--oro-satinato);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-top: 0;
        }

        #drawer a {
            display: block;
            margin: 20px 0;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s;
        }

        #drawer a:hover {
            color: var(--oro-satinato);
        }

        section {
            padding: 90px 40px;
            max-width: 1200px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .hero {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            max-width: 100%;
            padding: 100px 40px 80px 40px;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2em;
            color: var(--leaf-green);
            margin: 0;
        }

        .hero p {
            font-size: 1.25em;
            margin-top: 20px;
            color: #3b4d3a;
        }

        footer {
            background: var(--leaf-green-dark);
            color: white;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.95em;
            border-top: 4px solid var(--oro-satinato);
        }

        @media (max-width: 992px) {
            header {
                height: auto;
                padding: 20px;
                justify-content: center;
            }
            .logo-wrapper {
                text-align: center;
            }
            .brand-text {
                font-size: 2em;
            }
            nav {
                display: none;
            }
            #drawer-btn {
                display: block;
            }
            .hero h1 {
                font-size: 2.4em;
            }
        }
    </style>
</head>

<body>

<button id="drawer-btn" onclick="toggleDrawer()">
    <i class="fas fa-bars"></i>
</button>

<div id="drawer">
    <h2>CertifOrti</h2>
    <a href="#home" onclick="toggleDrawer()">Home</a>
    <a href="#chi-siamo" onclick="toggleDrawer()">Chi Siamo</a>
    <a href="#servizi" onclick="toggleDrawer()">Servizi</a>
    <a href="#progetti" onclick="toggleDrawer()">Progetti</a>
    <a href="#iso" onclick="toggleDrawer()">Certificazioni ISO</a>
    <a href="#team" onclick="toggleDrawer()">Team</a>
    <a href="#preventivi" onclick="toggleDrawer()">Preventivi</a>
</div>

<header id="home">
    <div class="logo-wrapper">
        <div class="brand-text">CertifOrti</div>
    </div>

    <nav>
        <a href="#chi-siamo">Chi Siamo</a>
        <a href="#servizi">Servizi</a>
        <a href="#progetti">Progetti</a>
        <a href="#iso">Certificazioni ISO</a>
        <a href="#team">Team</a>
        <a href="#preventivi">Preventivi</a>
    </nav>
</header>

<script>
function toggleDrawer() {
    const drawer = document.getElementById("drawer");
    drawer.classList.toggle("open");
}
</script>

</body>
</html>
